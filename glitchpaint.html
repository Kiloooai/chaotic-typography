<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlitchPaint - Distorted Drawing Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            overflow: hidden;
            position: relative;
        }

        #canvas {
            display: block;
            cursor: crosshair;
            background: #000;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ff41;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            backdrop-filter: blur(5px);
            max-width: 300px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #00ff88;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00ff41;
        }

        input[type="color"] {
            width: 100%;
            height: 30px;
            border: 1px solid #00ff41;
            background: #111;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 5px;
            background: #111;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #00ff41;
            color: #000;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #00ff88;
            box-shadow: 0 0 15px #00ff41;
        }

        button.danger {
            background: #ff0041;
            color: #fff;
        }

        button.danger:hover {
            background: #ff2266;
            box-shadow: 0 0 15px #ff0041;
        }

        .glitch-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            color: #ff0041;
            text-shadow: 0 0 20px #ff0041;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .info {
            font-size: 10px;
            color: #666;
            margin-top: 10px;
            line-height: 1.4;
        }

        .value-display {
            float: right;
            color: #00ff41;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <h1>⚡ GLITCHPAINT</h1>

        <div class="control-group">
            <label>Glitch Mode</label>
            <select id="glitchMode">
                <option value="pixelSort">Pixel Sort</option>
                <option value="colorShift">Color Shift</option>
                <option value="scanline">Scanlines</option>
                <option value="vhs">VHS Distortion</option>
                <option value="rgbSplit">RGB Split</option>
                <option value="datamosh">Datamosh</option>
            </select>
        </div>

        <div class="control-group">
            <label>Glitch Intensity <span class="value-display" id="intensityValue">50%</span></label>
            <input type="range" id="intensity" min="0" max="100" value="50">
        </div>

        <div class="control-group">
            <label>Brush Size <span class="value-display" id="sizeValue">5</span></label>
            <input type="range" id="brushSize" min="1" max="50" value="5">
        </div>

        <div class="control-group">
            <label>Color</label>
            <input type="color" id="brushColor" value="#00ff41">
        </div>

        <div class="control-group">
            <button id="clearBtn" class="danger">CLEAR CANVAS</button>
            <button id="saveBtn">SAVE GLITCH ART</button>
        </div>

        <p class="info">
            Draw with your mouse. Glitch effects apply in real-time.
            The more you draw, the more it corrupts!
        </p>
    </div>

    <div class="glitch-indicator" id="glitchIcon">⚡</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const glitchIcon = document.getElementById('glitchIcon');

        // Controls
        const glitchModeSelect = document.getElementById('glitchMode');
        const intensitySlider = document.getElementById('intensity');
        const sizeSlider = document.getElementById('brushSize');
        const colorPicker = document.getElementById('brushColor');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        // Value displays
        const intensityValue = document.getElementById('intensityValue');
        const sizeValue = document.getElementById('sizeValue');

        // Resize canvas to full screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Drawing state
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let hue = 0;

        // Get current values
        function getGlitchMode() { return glitchModeSelect.value; }
        function getIntensity() { return intensitySlider.value / 100; }
        function getBrushSize() { return parseInt(sizeSlider.value); }
        function getColor() { return colorPicker.value; }

        // Update displays
        intensitySlider.addEventListener('input', () => {
            intensityValue.textContent = intensitySlider.value + '%';
        });
        sizeSlider.addEventListener('input', () => {
            sizeValue.textContent = sizeSlider.value;
        });

        // Glitch effect functions
        const glitchEffects = {
            pixelSort: (imageData, intensity) => {
                const data = imageData.data;
                const width = imageData.width;
                const sortChance = intensity * 0.3;

                // Randomly sort pixels horizontally
                for (let y = 0; y < imageData.height; y++) {
                    if (Math.random() < sortChance) {
                        const startX = Math.floor(Math.random() * width);
                        const length = Math.floor(Math.random() * 50 * intensity) + 10;
                        const endX = Math.min(startX + length, width);

                        // Extract row slice
                        const row = [];
                        for (let x = startX; x < endX; x++) {
                            const idx = (y * width + x) * 4;
                            row.push({
                                r: data[idx],
                                g: data[idx + 1],
                                b: data[idx + 2],
                                a: data[idx + 3]
                            });
                        }

                        // Randomly reorder
                        if (Math.random() > 0.5) {
                            row.reverse();
                        } else {
                            row.sort(() => Math.random() - 0.5);
                        }

                        // Put back
                        for (let x = startX, i = 0; x < endX; x++, i++) {
                            const idx = (y * width + x) * 4;
                            data[idx] = row[i].r;
                            data[idx + 1] = row[i].g;
                            data[idx + 2] = row[i].b;
                            data[idx + 3] = row[i].a;
                        }
                    }
                }
                return imageData;
            },

            colorShift: (imageData, intensity) => {
                const data = imageData.data;
                const shiftAmount = Math.floor(intensity * 50);

                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < 0.3) {
                        const shift = (Math.random() - 0.5) * shiftAmount;
                        data[i] = Math.min(255, Math.max(0, data[i] + shift));     // R
                        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] - shift)); // G
                        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + shift * 0.5)); // B
                    }
                }
                return imageData;
            },

            scanline: (imageData, intensity) => {
                const data = imageData.data;
                const lineHeight = Math.max(2, Math.floor(5 - intensity * 4 + 1));
                const darkness = intensity * 200;

                for (let y = 0; y < imageData.height; y++) {
                    if (y % lineHeight === 0) {
                        for (let x = 0; x < imageData.width; x++) {
                            const idx = (y * imageData.width + x) * 4;
                            data[idx] = Math.max(0, data[idx] - darkness);
                            data[idx + 1] = Math.max(0, data[idx + 1] - darkness);
                            data[idx + 2] = Math.max(0, data[idx + 2] - darkness);
                        }
                    }
                }
                return imageData;
            },

            vhs: (imageData, intensity) => {
                const data = imageData.data;
                const noiseAmount = intensity * 80;

                // Add static noise
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < 0.1 * intensity) {
                        const noise = Math.random() * noiseAmount;
                        data[i] = Math.min(255, data[i] + noise);
                        data[i + 1] = Math.min(255, data[i + 1] + noise);
                        data[i + 2] = Math.min(255, data[i + 2] + noise);
                    }
                }

                // Horizontal wobble
                const wobbleAmount = intensity * 10;
                for (let y = 0; y < imageData.height; y++) {
                    const offset = Math.sin(y * 0.1 + Date.now() * 0.001) * wobbleAmount;
                    if (Math.abs(offset) > 1) {
                        const srcStart = Math.max(0, Math.floor(offset));
                        const dstStart = Math.max(0, Math.floor(-offset));
                        const copyWidth = imageData.width - Math.abs(Math.floor(offset));

                        // Simplified: just shift some rows
                        if (Math.random() < 0.1) {
                            for (let x = 0; x < imageData.width; x++) {
                                const srcX = (x + srcStart) % imageData.width;
                                const dstX = (x + dstStart) % imageData.width;
                                const srcIdx = (y * imageData.width + srcX) * 4;
                                const dstIdx = (y * imageData.width + dstX) * 4;
                                data[dstIdx] = data[srcIdx];
                                data[dstIdx + 1] = data[srcIdx + 1];
                                data[dstIdx + 2] = data[srcIdx + 2];
                                data[dstIdx + 3] = data[srcIdx + 3];
                            }
                        }
                    }
                }
                return imageData;
            },

            rgbSplit: (imageData, intensity) => {
                const data = imageData.data;
                const copy = new Uint8ClampedArray(data);
                const offset = Math.floor(intensity * 20);

                for (let y = 0; y < imageData.height; y++) {
                    for (let x = 0; x < imageData.width; x++) {
                        const idx = (y * imageData.width + x) * 4;

                        // Red channel from shifted position
                        const srcR = (y * imageData.width + Math.min(imageData.width - 1, x + offset)) * 4;
                        data[idx] = copy[srcR];

                        // Green channel from original
                        // Leave as is

                        // Blue channel from opposite shifted position
                        const srcB = (y * imageData.width + Math.max(0, x - offset)) * 4;
                        data[idx + 2] = copy[srcB + 2];
                    }
                }
                return imageData;
            },

            datamosh: (imageData, intensity) => {
                const data = imageData.data;
                const corruptionChance = intensity * 0.4;

                // Randomly duplicate blocks of pixels
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < corruptionChance) {
                        const dupLength = Math.floor(Math.random() * 100) + 10;
                        const dupStart = Math.floor(Math.random() * (data.length / 4 - dupLength)) * 4;

                        for (let j = 0; j < dupLength * 4 && i + j < data.length; j++) {
                            data[i + j] = data[dupStart + j];
                        }
                        i += dupLength * 4;
                    }
                }
                return imageData;
            }
        };

        // Apply glitch to entire canvas (called after drawing)
        function applyGlitch() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const mode = getGlitchMode();
            const intensity = getIntensity();

            const processed = glitchEffects[mode](imageData, intensity);
            ctx.putImageData(processed, 0, 0);

            // Random visual feedback on icon
            glitchIcon.textContent = ['⚡', '🔴', '🌊', '📺', '👁️', '💾'][Math.floor(Math.random() * 6)];
        }

        // Drawing functions
        function draw(e) {
            if (!isDrawing) return;

            ctx.lineWidth = getBrushSize();
            ctx.lineCap = 'round';
            ctx.strokeStyle = getColor();

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();

            // Apply glitch effect
            applyGlitch();

            lastX = e.clientX;
            lastY = e.clientY;
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            isDrawing = true;
            lastX = touch.clientX;
            lastY = touch.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            draw({ clientX: touch.clientX, clientY: touch.clientY });
        });

        canvas.addEventListener('touchend', () => isDrawing = false);

        // Clear canvas
        clearBtn.addEventListener('click', () => {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        // Save image
        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `glitch-art-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        // Background fill
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Easter egg: Konami code toggles rainbow mode
        let konami = [];
        const secret = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        document.addEventListener('keydown', (e) => {
            konami.push(e.key);
            konami = konami.slice(-10);
            if (konami.join(',') === secret.join(',')) {
                alert('🌈 Rainbow mode activated! (just kidding, but you found the easter egg)');
            }
        });

        console.log("%c GLITCHPAINT ", "background: #00ff41; color: black; font-size: 20px; font-weight: bold;");
        console.log("A canvas of digital corruption...");
    </script>
</body>
</html>
